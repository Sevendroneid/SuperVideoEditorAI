name: production-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render production
        env: { API: https://supervideoeditorai-api-v2.onrender.com }
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "$API/health" -o health.json; then
              cat health.json
              python - <<'PY'
          import json
          data=json.load(open('health.json'))
          assert data.get('status') == 'ok', data
          assert data.get('persistent_storage') is True, data
          assert data.get('ffmpeg_ready') is True, data
          PY
              break
            fi
            sleep 5
          done
          test -s health.json
      - name: Allow Render rollout to settle
        run: sleep 5
      - name: Generate >40 MiB MP4 fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=880:sample_rate=48000 -t 30 -c:v libx264 -preset ultrafast -b:v 12M -pix_fmt yuv420p -c:a aac -b:a 128k -shortest /tmp/production-e2e-source.mp4
          SIZE=$(stat -c%s /tmp/production-e2e-source.mp4)
          echo "fixture_bytes=$SIZE"
          test "$SIZE" -gt $((40 * 1024 * 1024))
          test "$SIZE" -lt $((50 * 1024 * 1024))
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/production-e2e-source.mp4
      - name: Production chunked signed upload smoke test
        env: { API: https://supervideoeditorai-api-v2.onrender.com }
        run: |
          set -euo pipefail
          python - "$API" /tmp/production-e2e-source.mp4 <<'PY'
          import json,sys,urllib.error,urllib.request
          from pathlib import Path
          api=sys.argv[1].rstrip('/'); data=Path(sys.argv[2]).read_bytes(); filename='production-large-smoke.mp4'; chunk_size=40*1024*1024; count=(len(data)+chunk_size-1)//chunk_size
          def req(method,url,body=None,headers=None):
              r=urllib.request.Request(url,data=body,headers=headers or {},method=method)
              try:
                  with urllib.request.urlopen(r,timeout=180) as x:return x.status,x.read()
              except urllib.error.HTTPError as e:raise SystemExit(f'{method} {url} -> HTTP {e.code}: {e.read().decode("utf-8",errors="replace")}')
          _,body=req('POST',f'{api}/api/v1/projects'); project=json.loads(body)['project_id']; parts=[]
          for i in range(count):
              chunk=data[i*chunk_size:min(len(data),(i+1)*chunk_size)]
              payload=json.dumps({'filename':filename,'size':len(data),'part_index':i,'part_count':count}).encode()
              _,body=req('POST',f'{api}/api/v1/projects/{project}/clips/chunk-session',payload,{'Content-Type':'application/json'}); s=json.loads(body)
              assert s['part_index']==i and s['part_count']==count and s['chunk_size']==chunk_size,s
              status,_=req('PUT',s['signed_url'],chunk,{'Content-Type':'video/mp4','x-upsert':'true'}); assert status in (200,201),status
              parts.append(s['path']); print(f'chunk {i+1}/{count}: {len(chunk)} bytes PASS')
          manifest=f'{project}/ci-large.parts.mp4'; payload=json.dumps({'filename':filename,'storage_path':manifest,'bytes':len(data),'parts':parts}).encode()
          status,body=req('POST',f'{api}/api/v1/projects/{project}/clips/complete',payload,{'Content-Type':'application/json'}); assert status==200,body
          result=json.loads(body); assert result.get('chunked') is True and result.get('persistent') is True and result.get('bytes')==len(data) and result.get('parts')==count,result
          print('PRODUCTION CHUNKED UPLOAD: PASS')
          PY
      - name: Full production API E2E
        env: { API: https://supervideoeditorai-api-v2.onrender.com }
        run: |
          set -euo pipefail
          PROJECT_JSON=$(curl -fsS -X POST "$API/api/v1/projects")
          PROJECT=$(python -c 'import json,sys; print(json.load(sys.stdin)["project_id"])' <<< "$PROJECT_JSON")
          UPLOAD_JSON=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/clips" -F 'file=@/tmp/production-e2e-source.mp4;type=video/mp4')
          python - "$UPLOAD_JSON" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert data.get('persistent') is True and data.get('bytes',0)>1000,data
          PY
          ANALYZE_JSON=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/analyze")
          JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$ANALYZE_JSON")
          for attempt in $(seq 1 180); do JOB_JSON=$(curl -fsS "$API/api/v1/jobs/$JOB"); STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status"))' <<< "$JOB_JSON"); if [ "$STATUS" = completed ]; then break; fi; if [ "$STATUS" = failed ]; then cat <<< "$JOB_JSON"; exit 1; fi; sleep 2; done
          test "${STATUS:-}" = completed
          ANALYSIS=$(curl -fsS "$API/api/v1/projects/$PROJECT/analysis")
          python - "$ANALYSIS" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert data.get('clips') and data.get('segments') and data.get('timeline',{}).get('items'),data
          PY
          DIRECTOR=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/director" -H 'Content-Type: application/json' -d '{"instruction":"make the opening stronger"}')
          python - "$DIRECTOR" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert data.get('applied') is True and data.get('evidence_bound') is True,data
          PY
          RENDER=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/render")
          RENDER_JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$RENDER")
          for attempt in $(seq 1 180); do JOB_JSON=$(curl -fsS "$API/api/v1/jobs/$RENDER_JOB"); STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status"))' <<< "$JOB_JSON"); if [ "$STATUS" = completed ]; then break; fi; if [ "$STATUS" = failed ]; then cat <<< "$JOB_JSON"; exit 1; fi; sleep 2; done
          test "${STATUS:-}" = completed
          curl -fsS "$API/api/v1/projects/$PROJECT/output" -o /tmp/production-output.mp4
          test -s /tmp/production-output.mp4
          test "$(stat -c%s /tmp/production-output.mp4)" -gt 1000
          test "$(file -b --mime-type /tmp/production-output.mp4)" = video/mp4
          echo "PRODUCTION FULL E2E: PASS"
          echo "project=$PROJECT"
          echo "output_bytes=$(stat -c%s /tmp/production-output.mp4)"
