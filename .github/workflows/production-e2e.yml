name: production-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Render production
        env:
          API: https://supervideoeditorai-api-v2.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "$API/health" -o health.json; then
              cat health.json
              python - <<'PY'
          import json
          data=json.load(open('health.json'))
          assert data.get('status') == 'ok', data
          assert data.get('persistent_storage') is True, data
          assert data.get('ffmpeg_ready') is True, data
          PY
              break
            fi
            sleep 5
          done
          if [ ! -s health.json ]; then
            echo 'Render production health check failed'
            exit 1
          fi

      - name: Allow Render rollout to settle
        run: sleep 60

      - name: Generate deterministic MP4 fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=size=320x240:rate=10 \
            -f lavfi -i sine=frequency=880:sample_rate=8000 \
            -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            /tmp/production-e2e-source.mp4
          test -s /tmp/production-e2e-source.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/production-e2e-source.mp4

      - name: Production signed TUS upload smoke test
        env:
          API: https://supervideoeditorai-api-v2.onrender.com
        run: |
          set -euo pipefail
          python - "$API" /tmp/production-e2e-source.mp4 <<'PY'
          import base64
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = sys.argv[1].rstrip('/')
          fixture = Path(sys.argv[2])
          data = fixture.read_bytes()
          filename = 'production-tus-smoke.mp4'

          def request(method, url, body=None, headers=None):
              req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      return response.status, response.read(), dict(response.headers)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'{method} {url} -> HTTP {exc.code}: {detail}')

          status, body, _ = request('POST', f'{api}/api/v1/projects')
          assert status == 200, (status, body)
          project = json.loads(body)['project_id']

          query = urllib.parse.urlencode({'filename': filename, 'size': len(data)})
          status, body, _ = request('POST', f'{api}/api/v1/projects/{project}/clips/upload-session?{query}')
          assert status == 200, (status, body)
          session = json.loads(body)
          token = session.get('token')
          endpoint = session.get('resumable_endpoint')
          storage_path = session.get('path')
          assert token and token.count('.') == 2, session
          assert endpoint and endpoint.endswith('/storage/v1/upload/resumable'), session
          assert storage_path.startswith(project + '/'), session

          def b64(value):
              return base64.b64encode(value.encode()).decode()

          metadata = ','.join([
              f'bucketName {b64("supervideo")}',
              f'objectName {b64(storage_path)}',
              f'contentType {b64("video/mp4")}',
              f'cacheControl {b64("3600")}',
          ])
          headers = {
              'Tus-Resumable': '1.0.0',
              'Upload-Length': str(len(data)),
              'Content-Type': 'application/offset+octet-stream',
              'x-signature': token,
              'x-upsert': 'true',
              'Upload-Metadata': metadata,
          }
          status, body, response_headers = request('POST', endpoint, data, headers)
          assert status == 201, (status, body, response_headers)
          location = response_headers.get('Location')
          assert location, response_headers
          if location.startswith('/'):
              parsed = urllib.parse.urlparse(endpoint)
              location = f'{parsed.scheme}://{parsed.netloc}{location}'

          print('SIGNED TUS POST: PASS')
          print('location_host=', urllib.parse.urlparse(location).netloc)
          print('uploaded_bytes=', len(data))

          complete_payload = json.dumps({
              'filename': filename,
              'storage_path': storage_path,
              'bytes': len(data),
          }).encode()
          status, body, _ = request(
              'POST',
              f'{api}/api/v1/projects/{project}/clips/complete',
              complete_payload,
              {'Content-Type': 'application/json'},
          )
          assert status == 200, (status, body)
          complete = json.loads(body)
          assert complete.get('persistent') is True, complete
          assert complete.get('bytes') == len(data), complete
          print('SIGNED TUS COMPLETE: PASS')
          print('project=', project)
          print('storage_path=', storage_path)
          PY

      - name: Full production API E2E
        env:
          API: https://supervideoeditorai-api-v2.onrender.com
        run: |
          set -euo pipefail
          PROJECT_JSON=$(curl -fsS -X POST "$API/api/v1/projects")
          echo "$PROJECT_JSON"
          PROJECT=$(python -c 'import json,sys; print(json.load(sys.stdin)["project_id"])' <<< "$PROJECT_JSON")
          test -n "$PROJECT"

          UPLOAD_JSON=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/clips" \
            -F 'file=@/tmp/production-e2e-source.mp4;type=video/mp4')
          echo "$UPLOAD_JSON"
          python - "$UPLOAD_JSON" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('persistent') is True, data
          assert data.get('bytes',0) > 1000, data
          PY

          ANALYZE_JSON=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/analyze")
          echo "$ANALYZE_JSON"
          JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$ANALYZE_JSON")

          for attempt in $(seq 1 120); do
            JOB_JSON=$(curl -fsS "$API/api/v1/jobs/$JOB")
            echo "$JOB_JSON"
            STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status"))' <<< "$JOB_JSON")
            if [ "$STATUS" = completed ]; then break; fi
            if [ "$STATUS" = failed ]; then echo "$JOB_JSON"; exit 1; fi
            sleep 2
          done
          test "${STATUS:-}" = completed

          ANALYSIS=$(curl -fsS "$API/api/v1/projects/$PROJECT/analysis")
          echo "$ANALYSIS"
          python - "$ANALYSIS" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('clips'), data
          assert data.get('segments'), data
          assert data.get('timeline',{}).get('items'), data
          PY

          DIRECTOR=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/director" \
            -H 'Content-Type: application/json' \
            -d '{"instruction":"make the opening stronger"}')
          echo "$DIRECTOR"
          python - "$DIRECTOR" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('applied') is True, data
          assert data.get('evidence_bound') is True, data
          PY

          RENDER=$(curl -fsS -X POST "$API/api/v1/projects/$PROJECT/render")
          echo "$RENDER"
          RENDER_JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$RENDER")

          for attempt in $(seq 1 120); do
            JOB_JSON=$(curl -fsS "$API/api/v1/jobs/$RENDER_JOB")
            echo "$JOB_JSON"
            STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status"))' <<< "$JOB_JSON")
            if [ "$STATUS" = completed ]; then break; fi
            if [ "$STATUS" = failed ]; then echo "$JOB_JSON"; exit 1; fi
            sleep 2
          done
          test "${STATUS:-}" = completed

          curl -fsS "$API/api/v1/projects/$PROJECT/output" -o /tmp/production-output.mp4
          test -s /tmp/production-output.mp4
          test "$(stat -c%s /tmp/production-output.mp4)" -gt 1000
          test "$(file -b --mime-type /tmp/production-output.mp4)" = video/mp4
          echo "PRODUCTION FULL E2E: PASS"
          echo "project=$PROJECT"
          echo "output_bytes=$(stat -c%s /tmp/production-output.mp4)"
