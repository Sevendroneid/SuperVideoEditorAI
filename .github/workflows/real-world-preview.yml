name: real-world-preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep the public test URL alive"
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
          - "60"

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      preview_url: ${{ steps.tunnel.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start application stack
        run: docker compose up -d --build

      - name: Wait for web
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          break
              except Exception as exc:
                  print(f'Web not ready ({attempt + 1}/60): {exc}')
              time.sleep(2)
          else:
              raise SystemExit('Web did not become healthy')
          PY

      - name: Install Cloudflare Quick Tunnel client
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start temporary public preview
        id: tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
          for attempt in $(seq 1 30); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "PUBLIC_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$URL" > LIVE_PREVIEW_URL.txt
              {
                echo "## SuperVideoEditorAI live preview"
                echo
                echo "### Open this URL"
                echo
                echo "$URL"
                echo
                echo "Temporary anonymous TryCloudflare URL. It is valid only while this workflow run is alive."
              } > LIVE_PREVIEW.md
              echo "::notice title=SuperVideoEditorAI LIVE PREVIEW::$URL"
              echo "## SuperVideoEditorAI real-world preview" >> "$GITHUB_STEP_SUMMARY"
              echo "**Public URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "**Temporary duration:** ${PREVIEW_DURATION_MINUTES:-15} minutes" >> "$GITHUB_STEP_SUMMARY"
              echo "This is an anonymous TryCloudflare quick tunnel for testing only. It does not create or modify a Cloudflare account tunnel, DNS record, or custom domain." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 2
          done
          if [ -z "${PUBLIC_PREVIEW_URL:-}" ]; then
            cat tunnel.log
            exit 1
          fi

      - name: Publish live preview URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: supervideo-live-preview
          path: |
            LIVE_PREVIEW_URL.txt
            LIVE_PREVIEW.md
          if-no-files-found: error
          retention-days: 1

      - name: Verify public preview
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ['PUBLIC_PREVIEW_URL'].rstrip('/')

          def check(path):
              url = base + path
              last = None
              for attempt in range(15):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          body = response.read().decode('utf-8', errors='replace')
                          print(f'PUBLIC {path}: HTTP {response.status} body={body}')
                          if response.status == 200:
                              return body
                  except Exception as exc:
                      last = exc
                      print(f'Public endpoint not ready ({attempt + 1}/15) {url}: {exc}')
                  time.sleep(2)
              raise SystemExit(f'Public endpoint verification failed: {url}; last error: {last}')

          check('/')
          health = check('/health')
          try:
              payload = json.loads(health)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'/health did not return valid JSON: {exc}')
          if payload.get('status') != 'ok':
              raise SystemExit(f'/health returned unexpected payload: {payload}')
          print('Public preview verification: PASS')
          PY

      - name: Create deterministic public E2E fixture
        run: |
          docker compose exec -T api ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=size=320x240:rate=10 \
            -f lavfi -i sine=frequency=880:sample_rate=8000 \
            -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /app/storage/public-e2e-source.mp4
          docker compose cp api:/app/storage/public-e2e-source.mp4 public-e2e-source.mp4

      - name: Verify public full video workflow
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = os.environ['PUBLIC_PREVIEW_URL'].rstrip('/')
          fixture = Path('public-e2e-source.mp4')

          def request(method, path, data=None, headers=None, timeout=30):
              req = urllib.request.Request(base + path, data=data, headers=headers or {}, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.read(), response.headers

          status, body, _ = request('POST', '/api/v1/projects')
          assert status == 200, (status, body)
          project = json.loads(body)['project_id']
          print('public project:', project)

          boundary = '----supervideo-public-e2e-boundary'
          payload = (
              f'--{boundary}\r\n'
              'Content-Disposition: form-data; name="file"; filename="source.mp4"\r\n'
              'Content-Type: video/mp4\r\n\r\n'
          ).encode() + fixture.read_bytes() + f'\r\n--{boundary}--\r\n'.encode()
          status, body, _ = request(
              'POST', f'/api/v1/projects/{project}/clips', data=payload,
              headers={'Content-Type': f'multipart/form-data; boundary={boundary}'}, timeout=60,
          )
          assert status == 200, (status, body)
          print('public upload:', body.decode())

          status, body, _ = request('POST', f'/api/v1/projects/{project}/analyze')
          assert status == 202, (status, body)
          analysis_job = json.loads(body)['id']
          print('public analysis job:', analysis_job)

          def wait_job(job_id):
              for attempt in range(90):
                  status, body, _ = request('GET', f'/api/v1/jobs/{job_id}')
                  assert status == 200, (status, body)
                  data = json.loads(body)
                  print('public job:', data['status'], data.get('progress'), data.get('message'))
                  if data['status'] == 'completed':
                      return data
                  if data['status'] == 'failed':
                      raise SystemExit(f'public job failed: {json.dumps(data)}')
                  time.sleep(2)
              raise SystemExit('public job timed out')

          wait_job(analysis_job)

          status, body, _ = request('GET', f'/api/v1/projects/{project}/analysis')
          assert status == 200, (status, body)
          analysis = json.loads(body)
          assert analysis.get('clips'), analysis
          assert analysis.get('segments'), analysis
          assert analysis.get('timeline', {}).get('items'), analysis
          print('public analysis verified: clips/segments/timeline present')

          status, body, _ = request(
              'POST', f'/api/v1/projects/{project}/director',
              data=json.dumps({'instruction': 'make the opening stronger'}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          assert status == 200, (status, body)
          director = json.loads(body)
          assert director.get('applied') is True, director
          assert director.get('evidence_bound') is True, director
          print('public director verified:', json.dumps(director))

          status, body, _ = request('POST', f'/api/v1/projects/{project}/render')
          assert status == 202, (status, body)
          render_job = json.loads(body)['id']
          print('public render job:', render_job)
          wait_job(render_job)

          status, body, headers = request('GET', f'/api/v1/projects/{project}/output', timeout=60)
          assert status == 200, (status, headers)
          assert len(body) > 1000, len(body)
          print('public rendered MP4 verified:', len(body), 'bytes')
          assert headers.get_content_type() == 'video/mp4', headers.get_content_type()
          print('Public full video workflow: PASS')
          PY

      - name: Keep preview alive
        env:
          PREVIEW_DURATION_MINUTES: ${{ inputs.duration_minutes || '15' }}
        run: |
          echo "LIVE PREVIEW URL: $PUBLIC_PREVIEW_URL"
          echo "Open the artifact 'supervideo-live-preview' if the URL is not visible in the GitHub UI."
          sleep $(( PREVIEW_DURATION_MINUTES * 60 ))

      - name: Stop stack
        if: always()
        run: docker compose down -v

# preview-ci trigger
